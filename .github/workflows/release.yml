name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node --test

      - name: Package source tarball
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git archive --format=tar.gz --prefix="dsh-deslop/" -o "dsh-deslop-${VERSION}.tar.gz" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "v1.0.1 — Startup and CI fixes"
          body: |
            ## dsh-deslop v1.0.1

            Startup and CI fixes on top of 1.0.0.

            ### Fixed
            - Plugin failed to start (`cannot get property "commands" without inject`) - now declares its required service
            - `/deslop` slash command now registers and appears
            - CI red on every push (`ERR_UNSUPPORTED_DIR_IMPORT`) - test discovery fixed
            - `private: true` removed, so the package installs from a registry too

            ### Works on any DSH host
            `/deslop` registers wherever a command registry exists. The dsh-go
            buttons stay dormant elsewhere instead of breaking startup.

            **Install:**
            ```sh
            npm install -g github:0xshahriar/dsh-deslop
            ```
          files: dsh-deslop-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
