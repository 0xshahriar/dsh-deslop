name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node --test

      - name: Package source tarball
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git archive --format=tar.gz --prefix="dsh-deslop/" -o "dsh-deslop-${VERSION}.tar.gz" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Track the pushed tag instead of hardcoding a version, so every
          # release attaches its own tarball and no asset lands on an older one.
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](CHANGELOG.md) for what changed in this release.

            **Install**
            ```sh
            npm install -g github:0xshahriar/dsh-deslop
            ```

            > Installing into DSH from a GitHub URL fails on strict hosts
            > (dsh-android) with `bundle: null`; use a local path or an npm
            > registry spec instead.
          files: dsh-deslop-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
