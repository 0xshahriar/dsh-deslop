name: Publish to npm

# Publishes in three situations:
#   1. A GitHub release is published        -> publish that tag's version
#   2. A push to main carries a NEW version -> publish it automatically
#   3. Manual dispatch                      -> dry-run by default
#
# Authentication uses npm Trusted Publishing (OIDC) when the package is
# configured for it on npmjs.com, so no long-lived token is stored. Set the
# NPM_TOKEN secret only as a fallback if trusted publishing is unavailable.

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run only"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance / trusted publishing

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Read package version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Publishing check for $NAME@$VERSION"

      - name: Has this version been published already?
        id: check
        run: |
          if npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta.outputs.version }} is already on npm; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta.outputs.version }} is not on npm yet."
          fi

      - name: Run tests
        run: node --test

      - name: Verify the packed tarball carries its DSH patch and bins
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          fail() { echo "::error::$1"; exit 1; }
          grep -q "cordis.patch.yml" /tmp/pack.txt || fail "cordis.patch.yml is missing from the published files"
          grep -q "bin/dsh-deslop.js" /tmp/pack.txt || fail "bin/dsh-deslop.js is missing"
          grep -q "bin/dsh-deslop-exec.js" /tmp/pack.txt || fail "bin/dsh-deslop-exec.js is missing"

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: |
          steps.check.outputs.published == 'false' &&
          (github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
